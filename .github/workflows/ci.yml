name: CI

# Pull requests run Bazel on Linux: tests, clippy, and rustfmt on every Rust target, and a read-only smoke
# run. Linux also cross-builds and lints everything for macOS; the macOS runner runs that build's tests and smoke run
# without a toolchain of its own. The release build runs too, and each archive is unpacked and run on the OS and
# architecture it targets. Pull requests write Bazel's action outputs and test results to BuildBuddy; a weekly run
# on main only refreshes the GitHub caches of downloads that pull requests restore (GitHub scopes a pull request's caches
# to that pull request).
on:
  pull_request:
  schedule:
    # Caches unused for 7 days are evicted.
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          # Action outputs go through BuildBuddy (.bazelrc). Without an API key, pull requests only read from it.
          bazelrc: |
            ${{ secrets.BUILDBUDDY_API_KEY && format('common --remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
            ${{ !secrets.BUILDBUDDY_API_KEY && github.event_name == 'pull_request' && 'common --noremote_upload_local_results' || '' }}
      - run: bazel test --config=ci //...
      # Read-only: shows what this runner has.
      - name: Smoke test
        run: |
          bazel run --config=ci //:clnr -- providers --root "$RUNNER_TEMP"
          bazel run --config=ci //:clnr -- list --root "$RUNNER_TEMP"
          bazel run --config=ci //:clnr -- config check

  cross:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          # Action outputs go through BuildBuddy (.bazelrc). Without an API key, pull requests only read from it.
          bazelrc: |
            ${{ secrets.BUILDBUDDY_API_KEY && format('common --remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
            ${{ !secrets.BUILDBUDDY_API_KEY && github.event_name == 'pull_request' && 'common --noremote_upload_local_results' || '' }}
      - run: >-
          bazel build --config=ci --config=lint --platforms=@rules_rs//rs/platforms:aarch64-apple-darwin
          //... //:rust-test-bundle
      - run: |
          mkdir out
          cp bazel-bin/rust-test-bundle.tar.gz bazel-bin/crates/clnr/clnr out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/
          retention-days: 3

  macos:
    needs: cross
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
      # Each test runs from its runfiles tree, as `bazel test` would run it, with an empty HOME.
      - name: Test
        run: |
          mkdir -p tests "$RUNNER_TEMP/home" && tar -xzf rust-test-bundle.tar.gz -C tests && cd tests
          failed=()
          for runfiles in *.runfiles; do
            test=${runfiles%.runfiles}
            echo "::group::$test"
            (cd "$runfiles/_main" && env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin "../../$test") || failed+=("$test")
            echo "::endgroup::"
          done
          if ((${#failed[@]})); then echo "::error::Failed: ${failed[*]}"; exit 1; fi
      # Read-only: shows what this runner has, including Xcode's caches.
      - name: Smoke test
        run: |
          chmod +x clnr
          ./clnr providers --root "$RUNNER_TEMP"
          ./clnr list --root "$RUNNER_TEMP"
          ./clnr config check

  # The release build, exactly as the release workflow runs it, without publishing.
  dist:
    uses: ./.github/workflows/dist.yml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  # Unpacks each release archive on the OS and architecture it targets and runs it, read-only.
  smoke:
    name: smoke (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: |
          tar -xzf "dist/clnr-${{ matrix.target }}.tar.gz"
          bin="clnr-${{ matrix.target }}/clnr"
          "$bin" --version
          "$bin" providers --root "$RUNNER_TEMP"
          "$bin" config check
